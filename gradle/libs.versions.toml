[versions]
# Инструменты сборки: AGP, Kotlin и KSP
agp = "9.2.0"
kotlin = "2.2.10"
ksp = "2.3.6"

# Плагины Google
googleGmsGoogleServices = "4.4.4"

# AndroidX: ядро, жизненный цикл и Activity
coreKtx = "1.17.0"
lifecycleRuntimeKtx = "2.9.4"
activityCompose = "1.11.0"

# Jetpack Compose: BOM и явно заданные версии
composeBom = "2024.09.00"
foundation = "1.9.4"
animation = "1.9.4"

# Навигация
navigationCompose = "2.10.2"

# База данных: Room
room = "2.8.5"

# Настройки: DataStore
datastorePreferences = "1.3.0"

# Виджеты: Glance
glanceAppwidget = "1.2.0"

# Внедрение зависимостей: Koin
koin = "4.2.2"

# Сериализация Kotlin
kotlinxSerializationJson = "1.7.0"

# Фоновые задачи: WorkManager
workRuntimeKtx = "2.10.3"

# Push-уведомления: Firebase
firebaseMessaging = "25.0.1"

# Реклама: Yandex Mobile Ads
mobileads = "8.6.0"

# Модульные и инструментальные тесты
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"

[libraries]
# AndroidX: ядро, жизненный цикл и Activity
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Jetpack Compose: BOM и базовые компоненты
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "foundation" }
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation", version.ref = "animation" }

# Jetpack Compose: Material 3 и иконки
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# Jetpack Compose: предпросмотр и инструменты отладки
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }

# Навигация
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# База данных: Room
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Настройки: DataStore
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }

# Виджеты: Glance
androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glanceAppwidget" }

# Внедрение зависимостей: Koin
koin-core = { group = "io.insert-koin", name = "koin-core", version.ref = "koin" }
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-androidx-compose = { group = "io.insert-koin", name = "koin-androidx-compose", version.ref = "koin" }
koin-androidx-workmanager = { group = "io.insert-koin", name = "koin-androidx-workmanager", version.ref = "koin" }

# Сериализация Kotlin
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

# Фоновые задачи: WorkManager
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workRuntimeKtx" }

# Push-уведомления: Firebase
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging", version.ref = "firebaseMessaging" }

# Реклама: Yandex Mobile Ads
mobileads = { group = "com.yandex.android", name = "mobileads", version.ref = "mobileads" }

# Модульные тесты: JUnit
junit = { group = "junit", name = "junit", version.ref = "junit" }

# Инструментальные тесты: AndroidX и Espresso
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

# Инструментальные тесты: Jetpack Compose
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

[plugins]
# Сборка Android
android-application = { id = "com.android.application", version.ref = "agp" }

# Kotlin: Android, Compose и сериализация
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# Обработка символов: KSP
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

# Интеграция сервисов Google
google-gms-google-services = { id = "com.google.gms.google-services", version.ref = "googleGmsGoogleServices" }
