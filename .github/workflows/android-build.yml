name: Android build

on:
  push:
    branches:
      - master
      - feature/life-tracker-upgrade
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Compile all store variants
        run: ./gradlew :app:assembleGoogleDebug :app:assembleRustoreDebug :app:assembleHuaweiDebug --stacktrace
